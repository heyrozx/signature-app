name: simple_signature
description: Simple Signature Maker.

publish_to: 'none'

version: 1.2.2+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_file_saver: ^0.10.0
  share_plus: ^13.3.1
  google_fonts: ^9.0.0
  fluttertoast: ^10.0.2
  path_provider: ^2.1.6
  google_mobile_ads: ^9.1.0
  cupertino_icons: ^2.0.0
  material_ui: ^1.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
